name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  generate:
    runs-on: ubuntu-latest

    # Grant the GITHUB_TOKEN write permission to commit and push the output.
    permissions:
      contents: write

    steps:
      # 1. Check out the repository so the action can commit files
      - uses: actions/checkout@v4

      # 2. Generate the snake animation SVG
      - uses: Platane/snk@v3
        id: snake-svg
        with:
          github_user_name: maxproy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.dark.svg?palette=github-dark

      # 3. Deploy the generated files to the output branch
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

